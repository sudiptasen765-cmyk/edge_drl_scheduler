# Edge server fleet configuration
# power_idle_w / power_max_w define the idle+dynamic power model:
# P(u) = power_idle_w + (power_max_w - power_idle_w) * u^power_exponent

servers:
  - server_id: 1
    cpu_cores: 4
    ram_gb: 8
    base_latency_ms: 5
    bandwidth_mbps: 100
    power_idle_w: 20
    power_max_w: 65
    power_exponent: 1.2
    max_queue_length: 20

  - server_id: 2
    cpu_cores: 8
    ram_gb: 16
    base_latency_ms: 12
    bandwidth_mbps: 200
    power_idle_w: 30
    power_max_w: 110
    power_exponent: 1.2
    max_queue_length: 30

  - server_id: 3
    cpu_cores: 2
    ram_gb: 4
    base_latency_ms: 2
    bandwidth_mbps: 50
    power_idle_w: 12
    power_max_w: 35
    power_exponent: 1.2
    max_queue_length: 15

  - server_id: 4
    cpu_cores: 12
    ram_gb: 32
    base_latency_ms: 18
    bandwidth_mbps: 300
    power_idle_w: 45
    power_max_w: 180
    power_exponent: 1.3
    max_queue_length: 40